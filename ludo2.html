<!DOCTYPE html>
<html>
<head>
  <title>Ludo - 2 Players</title>
  <style>
    body { background: #111; color: #0f0; font-family: 'Orbitron', sans-serif; text-align: center; padding-top: 50px; }
    h1 { font-size: 2em; }
    .dice { font-size: 100px; margin: 20px; }
    .btn { padding: 15px 30px; font-size: 1.2em; margin: 10px; background: #0f0; border: none; color: #000; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Ludo - 2 Player Mode</h1>
  <h2 id="turn">Turn: Player 1 (Red)</h2>
  <div class="dice" id="diceDisplay">🎲</div>
  <button class="btn" onclick="rollDice()">Roll Dice</button>
  <h3 id="lastRoll">Roll: -</h3>

  <script>
    let currentPlayer = 1;

    function rollDice() {
      const roll = Math.floor(Math.random() * 6) + 1;
      document.getElementById("lastRoll").textContent = `Roll: ${roll}`;
      document.getElementById("diceDisplay").textContent = getDiceEmoji(roll);

      currentPlayer = currentPlayer === 2 ? 1 : currentPlayer + 1;
      const playerColors = ["", "Red", "Blue"];
      document.getElementById("turn").textContent = `Turn: Player ${currentPlayer} (${playerColors[currentPlayer]})`;
    }

    function getDiceEmoji(roll) {
      const diceEmojis = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
      return diceEmojis[roll];
    }
  </script>
</body>
</html>
