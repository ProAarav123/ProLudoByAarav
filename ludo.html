<!DOCTYPE html>
<html>
<head>
  <title>Select Mode</title>
  <style>
    body { background: #000; color: #0f0; text-align: center; font-family: 'Orbitron', sans-serif; }
    h1 { margin-top: 50px; }
    .btn { margin: 15px; padding: 15px 30px; font-size: 1.2em; background: #0f0; color: #000; border: none; cursor: pointer; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>Select Players</h1>
  <button class="btn" onclick="startGame(2)">2 Players</button>
  <button class="btn" onclick="startGame(3)">3 Players</button>
  <button class="btn" onclick="startGame(4)">4 Players</button>

  <script>
    function startGame(players) {
      window.location.href = `ludo${players}.html`;
    }
  </script>
</body>
</html>
