<!DOCTYPE html>
<html>
<head>
  <title>Enter Your Name</title>
  <style>
    body { background: black; color: lime; font-family: 'Orbitron', sans-serif; text-align: center; }
    input, button { font-size: 1.2em; padding: 10px; }
  </style>
</head>
<body>
  <h1>Enter Your Name</h1>
  <input type="text" id="nameInput" placeholder="Type your name...">
  <button onclick="submitName()">Enter</button>

  <script>
    function submitName() {
      const name = document.getElementById("nameInput").value;
      if(name) {
        window.location.href = `welcome.html?name=${encodeURIComponent(name)}`;
      }
    }
  </script>
</body>
</html>
